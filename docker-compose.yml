services:
  ros2_d435i_nav:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ros2_d435i_nav
    network_mode: host
    privileged: true
    runtime: nvidia          # NVIDIA GPU hozzaferes RViz2-hoz
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/ws/src:rw
      - ./config:/ws/config:rw
      - ./launch:/ws/launch:rw
      - /run/udev:/run/udev:ro
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/bus/usb:/dev/bus/usb
    group_add:
      - plugdev
    command: bash -c "
      source /opt/ros/kilted/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash &&
      ros2 launch d435i_navigation navigation.launch.py launch_rviz:=true"
