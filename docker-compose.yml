services:
  ros2_d435i_nav:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ros2_d435i_nav
    network_mode: host
    privileged: true
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - ./src:/ws/src:rw
      - ./config:/ws/config:rw
      - ./launch:/ws/launch:rw
    devices:
      - /dev:/dev
    command: bash -c "
      source /opt/ros/kilted/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash &&
      ros2 launch d435i_navigation navigation.launch.py"

  # Opcionalis RViz2 vizualizacio - csak ha fut X11/Wayland display
  # Inditasa: docker compose --profile rviz up
  rviz2:
    profiles: ["rviz"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: rviz2
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash -c "
      source /opt/ros/kilted/setup.bash &&
      rviz2"
