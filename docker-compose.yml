services:
  ros2_d435i_nav:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ros2_d435i_nav
    network_mode: host
    privileged: true
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
    volumes:
      # X11 socket — csak natív Linux Docker Engine esetén szükséges.
      # Docker Desktop esetén kommenteld ki az alábbi sort.
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        bind:
          create_host_path: false
      - ./src:/ws/src:rw
      - ./config:/ws/config:rw
      - ./launch:/ws/launch:rw
    devices:
      - /dev:/dev
    command: bash -c "
      source /opt/ros/kilted/setup.bash &&
      colcon build --symlink-install &&
      source install/setup.bash &&
      ros2 launch d435i_navigation navigation.launch.py"
