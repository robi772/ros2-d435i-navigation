version: '3.8'
services:
  ros2_d435i_nav:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ros2_d435i_nav
    network_mode: host
    privileged: true
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/ws/src:rw
      - ./config:/ws/config:rw
      - ./launch:/ws/launch:rw
    devices:
      - /dev:/dev
    command: bash -c "source /opt/ros/humble/setup.bash && colcon build --symlink-install && source install/setup.bash && ros2 launch d435i_navigation navigation.launch.py"
